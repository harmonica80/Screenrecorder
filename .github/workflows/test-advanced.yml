name: Test Advanced Windows
on:
  push:
    branches: [advanced-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run prepare:advanced
      - run: node --test desktop/*.test.js
      - run: npm run dist:advanced -- --publish never
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Screenrecorder-Pro-Advanced-0.2.0-beta.2
          path: release-advanced/*.exe
          retention-days: 14
