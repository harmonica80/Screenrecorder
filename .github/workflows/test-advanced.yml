name: Test Advanced Windows
on:
  push:
    branches: [advanced-preview]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run prepare:advanced
      - run: node --test desktop/*.test.js
      - run: npm run dist:advanced -- --publish never
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Screenrecorder-Pro-Advanced-0.2.0-beta.3
          path: release-advanced/*.exe
          retention-days: 14
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('desktop/advanced-builder.json')).extraMetadata.version;
            const tag = `advanced-v${version}`;
            const name = `Screenrecorder-Pro-Advanced-${version}-Portable.exe`;
            const release = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, target_commitish: context.sha,
              name: `螢幕錄影工具 Pro 進階版 ${version}`,
              body: fs.readFileSync('desktop/RELEASE-ADVANCED.md', 'utf8'), draft: true, prerelease: true
            });
            await github.rest.repos.uploadReleaseAsset({
              ...context.repo, release_id: release.data.id, name,
              data: fs.readFileSync(`release-advanced/${name}`)
            });
            await github.rest.repos.updateRelease({...context.repo, release_id:release.data.id, draft:false});
